## Ejercicio 3: La palabra `this`

Crea un objeto `cuenta` con:

/*

## Ejercicio 4: Constructores con `function`

Crea un constructor `Libro(titulo, autor, páginas)`.

Agrega métodos:

const Libro = function(titulo, autor, paginas){

/*

## Ejercicio 6: Propiedades y Métodos con `this`

Crea una clase `Producto` con:
- Constructor: `nombre`, `precio`, `stock`
- Método `vender(cantidad)`: disminuya stock, valide que haya stock disponible
- Método `reabastecer(cantidad)`: aumente stock
- Método `estado()`: devuelva "Productos: [nombre], Stock: [stock], Precio: €[precio]"

Realiza operaciones: vender 3, reabastecer 10, consultar estado.

*/

class Producto {
    constructor(nombre, precio, stock){
        this.nombre = nombre
        this.precio = precio
        this.stock = stock
    }
    vender(cantidad){
        if (cantidad >= this.stock) this.stock= 0
        else this.stock -= cantidad
    }
    reabastecer(cantidad){
        this.stock += cantidad
    }
    estado(){
        return "Productos: " + this.nombre + ", StocK: " + this.stock + " Precio: " + this.precio
    }
}

const producto1 = new Producto("Teclado", 22, 10)
const producto2 = new Producto("Mac Air", 1200, 5)
const producto3 = new Producto("Pantalla 22'", 120, 7)

producto1.vender(3)
producto1.reabastecer(10)
console.log(producto1.estado())

producto2.vender(3)
producto2.reabastecer(10)
console.log(producto2.estado())

producto3.vender(3)
producto3.reabastecer(10)
console.log(producto3.estado())

/*
## Ejercicio Bonus: Carrito de Compras

Crea una clase `Carrito` con:
- Array vacío `items` en constructor
- Método `agregarProducto(nombre, precio, cantidad)`: agrega objeto a items
- Método `total()`: suma todos los precios × cantidades
- Método `listar()`: imprime cada item del carrito
- Método `vaciar()`: elimina todos los items

Realiza:
1. Agregar 3 productos diferentes
2. Listar el carrito
3. Mostrar total
4. Vaciar y verificar
*/

class Carrito {
    constructor(){
        this.items = []
    }
    agregarProducto(nombre, precio, cantidad){
        this.items.push({
            nombre: nombre,
            precio: precio,
            cantidad: cantidad,
        })
    }
    total(){
        let total = this.items.reduce( (acum, item) => acum + (item.precio * item.cantidad), 0)
        console.log("El precio total es " + total + "€")
    }
    vaciar(){
        this.items = []
    }

}
    const carrito1 = new Carrito
    carrito1.agregarProducto("Teclado", 22, 2)
    carrito1.agregarProducto("Pantalla", 120, 5)
    carrito1.agregarProducto("Ratón", 6, 20)
    console.log(carrito1)
    carrito1.total()
    carrito1.vaciar()
    console.log(carrito1)
