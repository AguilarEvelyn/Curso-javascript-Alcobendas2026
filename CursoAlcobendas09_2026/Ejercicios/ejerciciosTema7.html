      /*Ejercicio 2: Métodos en Objetos

Crea un objeto `persona` con:
- `nombre`: "Evelyn"
- `edad`: 28
- `email`: "evelyn@example.com"
- Método `presentarse()`: que devuelva "Hola, soy Evelyn y tengo 28 años"
- Método `cumplirAños()`: que aumente la edad en 1

Llamar ambos métodos y mostrar los resultados.*/

const persona = {
    nombre: "Evelyn",
    edad: 28,
    email: "evelyn@example.com",   // cambiado para no publicar tu correo real
    

    presentarse: function() {
        return "Hola, soy " + this.nombre + " y tengo " + this.edad + " años";
       
    },

    cumplirAños: function() {
        this.edad = this.edad + 1;
       
    }
};

// Llamar a los a cada metodo y objeto completo.
console.log(persona.presentarse());   // 27 años
persona.cumplirAños();                 // sube a 28
console.log(persona.presentarse());   // 28 años
console.log(persona);                 // objeto completo
