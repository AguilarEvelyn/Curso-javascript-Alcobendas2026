<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            display:grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            height: 98vh;
            gap:2vh;
        }
        div{
            border:3px solid black;
        }
    </style>
</head>
<body>
    <div></div>
    <div></div>
    <div></div>
    <div></div>

    <script>
        /*Objetivo.
        No tocar el html, todo con JS.
        Al inicio debe salir un circulo de color aleatorio en el cuadrante 1,
        al hacer click en él, tiene que aparecer otro circulo (color aleatorio)
        en el cuadrante 2. Al hacer click, aparece otro en el cuadrante 3, luego
        en el cuarto y vuelta al primero.
        */

        const colorAleatorio = function () {
            return `rgb(${parseInt(Math.random() * 256)},${parseInt(Math.random() * 256)},${parseInt(Math.random() * 256)})`
        }

        const misDiv = document.querySelectorAll("div")

        misDiv.forEach((div, i) => {
            div.innerHTML = `
            <section id='circulo${i}' style=
            'border-radius: 50%;
            width:20vh;
            height:20vh;
            margin: 20vh auto;
            visibility:hidden;
            background: ${colorAleatorio()}
            ' onclick='cambiar(this)'>
            </section> 
            `
        })
        document.querySelector("#circulo2").id="circuloIn"
        document.querySelector("#circulo3").id="circulo2"
        document.querySelector("#circuloIn").id="circulo3"

        document.querySelector('#circulo0').style.visibility="visible"
        const cambiar = (elemento) => {
            let siguiente = Number(elemento.id.substring(7)) + 1
            elemento.style.visibility="hidden"
            if(siguiente == 4) siguiente = 0
            document.querySelector(`#circulo${siguiente}`).style.visibility = "visible"
            document.querySelector(`#circulo${siguiente}`).style.background = colorAleatorio()
        }

        


    </script>
</body>
</html>
