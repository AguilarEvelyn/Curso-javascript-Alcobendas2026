        /*

        ### 6. Operación Elegida

        - Devolver el resultado
        
        */

        function operacion(num1, num2, operacion) {
            let resultado = 0;
            switch(operacion) {
                case '+': resultado = num1+num2; break;
                case '-': resultado = num1-num2; break;
                case '*': resultado = num1*num2; break;
                case '/': resultado = num1/num2; break;
                default: console.log("la operacion no existe"); break;
            }
            return resultado;
        }

        console.log(operacion(1,1,'+'));

        /*
        
        ### 10. Número Primo
        Escribe una función que determine si un número es primo.
        
        **Requisitos:**
        - Parámetro: número
        - Devolver true si es primo, false si no
        - Primo = solo divisible por 1 y sí mismo
        
        */

        function esPrimo(numero){
            for(let x = numero-1; x>1; x--){
                if(numero % x == 0) return false
            }
            return true
        }

        console.log("15", esPrimo(15))
        console.log("13", esPrimo(13))
        console.log("6", esPrimo(6))
        console.log("37", esPrimo(37))
