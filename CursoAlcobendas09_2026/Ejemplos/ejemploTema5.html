<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tema 6 Funciones</title>
</head>

<body>
    <h1>☺️ Tema 6 Funciones ☺️</h1>
    <div></div>

    <script>
        function saludar() {
            document.querySelector("div").innerHTML += "Buenos tardes, invitado <br>"
        }

        function saludarNominal(nombre) {
            document.querySelector("div").innerHTML += "Buenos tardes, " + nombre + "<br>"
        }

        function dameFecha() {
            const ahora = new Date()
            return "Fecha actual: " + ahora //Cuando encuentra un return sale de la función
            console.log("Fecha actual", "Esto nunca se ejecuta")
        }

        let now = dameFecha()
        document.querySelector('div').innerText = now

        function sumar(n1, n2) {
            console.log(n1 + n2)
        }
        sumar(5, 3, 5)
        sumar("3")

        //Parametros por defecto

        function sumar(n1, n2, n3 = 0, n4 = 0) {
            console.log(n1 + n2 + n3 + n4)
        }

        sumar(5, 3, 5)

        // Lo anterior se conoce como funciones declaradas.

        function calcularIva(bruto) {
            //return bruto * 1.21;
            const resultado = bruto * 1.21
            console.log(resultado)
            console.warn("Bye");
            return resultado; //Devuelve un resultado
            
        }

        console.log(calcularIva(100))
        const calcularIva3 = calcularIva(100)
        console.log(calcularIva3)

        // Expresiones

        const calcularIva2 = function (bruto) {
            return bruto * 1.21
        }

        console.log(calcularIva2(100))

        // Funciones flecha o arrow

         //Pueden tener llaves o no. Si tiene llaves, hay que implementar
         // un return si devulve algo, sirva para más de una instruccion

        const cuadrado = (num) => {
            return num * num;
        }

        console.log(cuadrado (3))

        // Forma abreviada, sólo espera un instrucción y devuelve el valor

        const cuadrado2 = num => num * num
        const suma2 = (n1, n2) => n1 + n2 //No es necesario el return

        console.log(cuadrado2(5))

        //Llamar una función antes de declararla es posible

        hazAlgo(5) //No funciona con expresiones ni funciones flecha

        function hazAlgo(){ //Carga el memoria antes. Se elevan.

            alert("Haciendo, ...")
        }

    </script>
</body>

</html>
