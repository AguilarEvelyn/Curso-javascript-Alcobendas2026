    <h1>😉 Expresiones regulares. Regex. Patrones 😉</h1>

    <script>

        // Expresiones regulares.  Regex. Patrones

        const patron1 = /^\d+$/
        const patron2 = /^[0-9]+$/
        console.log(patron1.test("12345"), patron2.test("12345")) //true
        console.log(patron1.test(""),patron2.test("")) //false
        console.log(patron1.test("123a5"),patron1.test("123a5")) //false

        /* Síntasis básica

        Elementos más comunes:
        - '^' Inicio del texto
        - '$' Final del texto
        - [ ] conjunto de caracteres permitidos
        - '+' una o más repeticiones
        - '*' cero o más repeticiones
        - '?' opcional
        - \d  digito
        - \w  alfanúmerico y guión bajo [A-Za-z0-9_]
        - \s  espacio en blanco
        - {n} cantidad exacta
        - {min, max} rango de repeticiones 
        */

        const patron3 = /^[A-Za-z\s]{2,}$/ //solo letras y espacios y mínimo dos caracteres

        console.log( "a", patron3.test("a")) //false
        console.log( "a 3", patron3.test("a 3")) //false
        console.log( "abcd", patron3.test("abcd")) //true
        console.log( "mañana", patron3.test("mañana")) //false
        console.log( "miercoles,",patron3.test("miercoles,")) //false
        console.log( "AZaaaBCDF",patron3.test("AZaaaBCDF")) //true

        const patronCP = /^\d{5}$/
        console.log(patronCP.test("09123"))
        console.log(patronCP.test("9123"))
         console.log(patronCP.test("09123adfasdfds"))

        const patronMovil = /^[67]\d{2}\s\d{2}\s\d{2}\s\d{2}$/ //678 52 40 30. En España puede empezar por 6 o por 7
        console.log("678 52 40 30",patronMovil.test("678 52 40 30")) //true
        console.log("678524030",patronMovil.test("67854030")) //false
        console.log("978 52 40 30",patronMovil.test("978 52 40 30")) //false
        console.log("678 52 40 3O",patronMovil.test("678 52 40 3O")) //false

        const patronFecha = /^[0-9]{2}\/\d{2}\/\d{4}$/    //  28/10/2026
        console.log("28/10/2026", patronFecha.test("28/10/2026")) //true
        console.log("28-10-2026", patronFecha.test("28-10-2026")) //false
        console.log("28/10/26", patronFecha.test("28/10/26"))     //false

        const patronMatricula = /^\d{4}[B-DF-HJ-MPRT-VZ][A-PR-Z]{2}$/  //"1234CLN"
        console.log("1234CLN", patronMatricula.test("1234CLN"))
        console.log("1234CL", patronMatricula.test("1234CL"))
        console.log("1234aLN", patronMatricula.test("1234aLN"))
        console.log("1234ALN", patronMatricula.test("1234ALN"))
        console.log("1234LQN", patronMatricula.test("1234LQN"))

        //usuario alfanúmerico con guión bajo (3 a 12)
        const rx = /^[A-Za-z0-9_]{3,12}$/
        console.log("user_01", rx.test("user_01")) //true
        console.log("us", rx.test("us")) //false

        // URL básica http o https. https://www.google.com?fddfs=manolo&name=luis

        const rxUrl = /^https?:\/\/[\w.-]+(?:\.[\w.-]+)?$/
        console.log("https://ejemplo.com", rxUrl.test("https://ejemplo.com"))
        console.log("https://ejemplo.com", rxUrl.test("https://ejemplo.com"))
        console.log("ftp://ejemplo.com", rxUrl.test("ftp://ejemplo.com"))

        //Quitar espacios duplicados replace(lo que quiero reemplazar , como lo reemplazo)

        const texto = "Hola      mundo      regex"
        const limpio = texto.replace(/\s+/g, " ")
        console.log(texto, limpio)

        //Encontrar hashtags en un texto

        const texto2 = "Hoy vemos #regex y #javascript en clase"
        const hashtags = texto2.match(/#[\w]+/g) ||[]. //g para que busque todos.
        console.log(hashtags)
        console.log("Hoy vemos regex  y javascript en clase".match(/#[\w]+/g) ||[])

        //Métodos útiles con regex

        // test() comprobar si cumple

        console.log(/^\d+$/.test("123")) //true

        //match() obtener coincidencias

        const txt = "IDs: 12, 45, 700"
        const nums = txt.match(/\d+/g)
        console.log(nums)

        //replace() reemplazar

        const fecha = "2026-04-26"
        const nuevaFecha = fecha.replace(/-/g, "/")
        console.log(nuevaFecha)

        //split() dividir con patrón

        const colores = "rojo, azul, verde|amarillo; blanco"
        const partes = colores.split(/[,;|]\s*/)
        console.log(partes)

        //search() posición de la primera coincidencia

        const curso = "Curso JavaScript 2026"
        console.log(curso.search(/\d{4}/)) //
